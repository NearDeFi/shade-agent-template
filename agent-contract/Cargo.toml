[package]
name = "shade-contract-template"
version = "0.1.0"
edition = "2024"
description = "Basic Shade Agents contract template with local dependencies"
license = "Apache-2.0"

# For reproducible builds
repository = "https://github.com/<xxx>/<xxx>" # Replace with your repository
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
near-sdk = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
shade-attestation = "=0.2.0"

[dev-dependencies]
near-api = "=0.8.6"
near-api-types = "=0.8.6"
near-sandbox = "=0.3.9"
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
serde_json = "=1.0.149"
shade-attestation = "=0.2.0"
tokio = { version = "=1.52.1", features = ["full"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true
